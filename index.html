<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musicollège, ton studio musical</title>
<meta name="description" content="Écouter, comparer, créer et argumenter en éducation musicale au collège (6e-3e). Gratuit, sans compte.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%231A1D3A'/%3E%3Ccircle cx='50' cy='50' r='18' fill='%23FFC12E'/%3E%3Ccircle cx='50' cy='50' r='4' fill='%231A1D3A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Lexend:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1A1D3A;--ink2:#262A52;--paper:#EDEFF6;--card:#FFFFFF;--line:#D6D9E8;--muted:#545978;--orange:#FF7A3D;--blue:#3D5AFE;--violet:#7B5CFF;--pink:#FF4F86;--mint:#13A88F;--yellow:#FFC12E;--good:#0F8A5F;--bad:#C8344F;--r:14px;--display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;--body:"Atkinson Hyperlegible","Segoe UI",Roboto,system-ui,sans-serif}
*{box-sizing:border-box}
html{font-size:106.25%}
body{margin:0;font-family:var(--body);color:var(--ink);background:var(--paper);line-height:1.55}
body.dys{--body:"Lexend","Segoe UI",system-ui,sans-serif;--display:"Lexend","Segoe UI",system-ui,sans-serif;letter-spacing:.01em;word-spacing:.08em}
body.big{font-size:118%}
body.contrast{--muted:#2A2E4A;--line:#8A8FB0;--paper:#FFFFFF}
h1,h2,h3{font-family:var(--display);line-height:1.12;letter-spacing:-.015em;margin:0 0 .4em}
h1{font-size:clamp(1.9rem,4.2vw,2.8rem);font-weight:800}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.08rem;font-weight:700;margin-top:1.1em}
p{margin:0 0 .8em}
a{color:var(--blue)}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--yellow);color:var(--ink);padding:8px 14px;border-radius:8px;z-index:50}
.skip:focus{left:12px}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

/* En-tête */
.top{background:var(--ink);color:#fff;position:sticky;top:0;z-index:20}
.top-in{max-width:1180px;margin:auto;display:flex;align-items:center;gap:22px;padding:12px 22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:-.02em}
.brand-disc{width:30px;height:30px;border-radius:50%;background:repeating-radial-gradient(circle,#111 0 2px,#2c2c2c 2px 4px);position:relative;flex:none}
.brand-disc:after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--yellow)}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav a{color:#D6D9F5;text-decoration:none;font-weight:700;padding:7px 12px;border-radius:999px;font-size:.95rem}
nav a:hover{background:rgba(255,255,255,.08);color:#fff}
nav a.on{background:var(--yellow);color:var(--ink)}
#stop{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.35);border-radius:999px;padding:7px 14px;font:inherit;font-weight:700;font-size:.9rem;cursor:pointer}
#stop:hover{border-color:#fff}
main{max-width:1180px;margin:auto;padding:30px 22px 70px;min-height:70vh}
footer{text-align:center;color:var(--muted);padding:28px 20px;font-size:.88rem;border-top:1px solid var(--line)}

/* Boutons */
.btn{font:inherit;font-weight:700;border:0;cursor:pointer;border-radius:12px;padding:12px 18px;background:var(--ink);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:8px;line-height:1.2}
.btn:hover{filter:brightness(1.18)}
.btn.sm{padding:8px 12px;font-size:.9rem}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.danger{background:var(--bad)}
.btn.sun{background:var(--yellow);color:var(--ink)}
.btn.line{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
.btn.file{position:relative;overflow:hidden}
.btn.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.row-btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}

/* Vinyles */
.vinyl{display:inline-block;position:relative;border-radius:50%;background:repeating-radial-gradient(circle,#15151c 0 1.5px,#2a2a35 1.5px 3px);box-shadow:0 6px 18px rgba(10,10,30,.35);flex:none}
.vinyl:before{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(130deg,rgba(255,255,255,.14),transparent 40%,transparent 60%,rgba(255,255,255,.08))}
.vinyl .label{position:absolute;inset:33%;border-radius:50%;display:grid;place-items:center;color:var(--ink);font-weight:800;font-size:1.6rem;box-shadow:0 0 0 3px rgba(0,0,0,.25)}
.vinyl .label:after{content:"";position:absolute;width:8%;height:8%;min-width:4px;min-height:4px;border-radius:50%;background:#15151c}
.vinyl.small{width:52px;height:52px}
.vinyl.small .label{inset:30%}
.vinyl.gold{background:repeating-radial-gradient(circle,#B88A1E 0 1.5px,#E4BC4E 1.5px 3px)}
.vinyl.big{width:min(290px,52vw);height:min(290px,52vw)}
.is-playing .vinyl.spin{animation:spin 1.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Accueil */
.hero{background:var(--ink);color:#fff;border-radius:26px;padding:42px;display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:center;overflow:hidden;position:relative}
.hero h1{font-size:clamp(2.2rem,5vw,3.9rem);line-height:1.02;letter-spacing:-.035em;margin-bottom:.35em;max-width:12ch}
.hero p{color:#D6D9F5;max-width:52ch}
.now-playing{font-size:.92rem;margin-top:14px}
.now-playing strong{color:#fff}
.deck{position:relative;background:#2B3062;border-radius:22px;aspect-ratio:1.15;display:grid;place-items:center;box-shadow:inset 0 2px 0 rgba(255,255,255,.08),0 30px 60px rgba(0,0,0,.35)}
.platter{border-radius:50%;padding:12px;background:#1B1F45;box-shadow:inset 0 0 0 2px #3A3F7A}
.arm{position:absolute;top:10%;right:9%;width:16px;height:16px;border-radius:50%;background:#C9CCE8;box-shadow:0 0 0 6px #3A3F7A}
.arm span{position:absolute;top:8px;left:5px;width:6px;height:min(190px,40vw);background:#C9CCE8;border-radius:3px;transform-origin:top center;transform:rotate(12deg);transition:transform .8s ease}
.arm span:after{content:"";position:absolute;bottom:-6px;left:-5px;width:16px;height:24px;background:#E8EAF7;border-radius:4px}
.is-playing .arm span{transform:rotate(27deg)}
.knob{position:absolute;bottom:9%;width:22px;height:22px;border-radius:50%;background:var(--yellow)}
.knob.k1{left:8%}.knob.k2{left:calc(8% + 34px);background:var(--pink)}
.block{margin:40px 0 0}
.block>h2{margin-bottom:.6em}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 34px;padding-right:30px}
.sleeve{position:relative;aspect-ratio:1;border-radius:6px;color:#fff;text-decoration:none;display:block;isolation:isolate}
.sleeve .vinyl.peek{position:absolute;width:88%;height:88%;top:6%;right:-14%;z-index:-1;transition:right .35s ease}
.sleeve:hover .vinyl.peek,.sleeve:focus-visible .vinyl.peek{right:-24%}
.sleeve-art{position:absolute;inset:0;border-radius:6px;background:var(--sc);box-shadow:0 10px 24px rgba(26,29,58,.18)}
.sleeve-text{position:absolute;left:18px;right:18px;bottom:16px}
.sleeve-text strong{display:block;font-family:var(--display);font-size:clamp(1.25rem,2.3vw,1.7rem);line-height:1.05;letter-spacing:-.02em}
.sleeve-text small{font-size:.86rem;opacity:.92}
.c-orange{--sc:var(--orange)}.c-blue{--sc:var(--blue)}.c-violet{--sc:var(--violet)}.c-pink{--sc:var(--pink)}.c-mint{--sc:var(--mint)}.c-yellow{--sc:var(--yellow)}
.c-yellow .sleeve-text,.c-yellow.m-head{color:var(--ink)}
.p-stripes .sleeve-art,.mini-sleeve.p-stripes{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.22) 0 16px,transparent 16px 32px)}
.p-rings .sleeve-art,.mini-sleeve.p-rings{background-image:repeating-radial-gradient(circle at 78% 22%,rgba(255,255,255,.25) 0 6px,transparent 6px 20px)}
.p-blocks .sleeve-art,.mini-sleeve.p-blocks{background-image:linear-gradient(90deg,rgba(26,29,58,.18) 50%,transparent 50%),linear-gradient(rgba(255,255,255,.18) 50%,transparent 50%);background-size:50% 100%,100% 50%}
.p-waves .sleeve-art,.mini-sleeve.p-waves{background-image:radial-gradient(circle at 50% 0,transparent 18px,rgba(255,255,255,.22) 19px 26px,transparent 27px);background-size:52px 30px}
.p-grid .sleeve-art,.mini-sleeve.p-grid{background-image:radial-gradient(rgba(26,29,58,.28) 3px,transparent 3.5px);background-size:22px 22px}
.p-sun .sleeve-art,.mini-sleeve.p-sun{background-image:repeating-conic-gradient(from 0deg at 50% 38%,rgba(255,255,255,.3) 0 8deg,transparent 8deg 22deg)}
.strip{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;margin-top:40px;padding:16px 20px;border-radius:var(--r);background:var(--card);color:var(--ink);text-decoration:none;border:1px solid var(--line)}
.bar{display:block;height:10px;border-radius:99px;background:#E1E4F0;overflow:hidden}
.bar span{display:block;height:100%;background:var(--ink);border-radius:99px}
.bar.big{height:16px}

/* Studios et tuiles */
.page-head{max-width:760px;margin-bottom:26px}
.studio{margin:0 0 44px;scroll-margin-top:90px}
.studio-head{display:flex;gap:18px;align-items:center;margin-bottom:16px}
.mini-sleeve{width:64px;height:64px;border-radius:5px;background-color:var(--sc);flex:none}
.studio-head p{margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{display:flex;gap:14px;align-items:center;padding:14px 16px;background:var(--card);border-radius:var(--r);text-decoration:none;color:var(--ink);border:1px solid var(--line);border-bottom:4px solid var(--c)}
.tile:hover{border-color:var(--c)}
.tile-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.tile-body strong{font-family:var(--display);font-size:1.08rem}
.tile-body .muted{font-size:.9rem}
.pill{align-self:flex-start;margin-top:4px;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:99px;background:#E6E8F2;color:var(--muted)}
.pill.ok{background:#DDF3EA;color:var(--good)}
.pill.gold{background:#FFF0C7;color:#8A6200}
.pill.due{background:#FFE3D6;color:#A3431A}
.pill.new{background:#E3E7FF;color:#2F45C7}

/* Mission */
.back{display:inline-block;margin-bottom:14px;font-weight:700;text-decoration:none}
.m-head{display:flex;gap:18px;align-items:flex-start;background:var(--sc);color:#fff;border-radius:20px;padding:24px;margin-bottom:22px}
.m-head .mini-sleeve{background-color:rgba(0,0,0,.12);box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.m-head h1{margin-bottom:.2em}
.m-head p{margin:0 0 .3em;max-width:62ch}
.meta{font-size:.88rem;opacity:.9}
.sep{opacity:.6;margin:0 4px}
.m-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.q-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px}
.q-num{font-weight:700;color:var(--muted);margin:0 0 4px;font-size:.92rem}
.q-prompt{font-size:1.4rem;outline:none}
.dots{display:flex;gap:8px;list-style:none;padding:0;margin:0 0 16px}
.dots li{width:14px;height:14px;border-radius:50%;background:#E1E4F0}
.dots li.cur{box-shadow:0 0 0 3px var(--ink) inset}
.dots li.ok{background:var(--good)}
.dots li.ko{background:#F1A9B6}
.console{background:var(--ink);color:#fff;border-radius:16px;padding:14px;margin:16px 0}
#vu{display:block;width:100%;height:56px;color:var(--yellow);margin-bottom:10px}
.console-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.console-row.small{margin-top:10px;justify-content:space-between;font-size:.9rem}
.console .btn.ghost{color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.btn.pad{background:#363B70;color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3);padding:13px 18px}
.btn.pad:active{transform:translateY(1px);box-shadow:none}
.vol,.bpm{display:flex;align-items:center;gap:8px;font-weight:700;flex-wrap:wrap;margin:0}
.vol input{width:140px;accent-color:var(--yellow)}
.bpm input{width:150px;accent-color:var(--yellow)}
.bpm output{font-weight:400;font-size:.9rem}
.answers{display:grid;gap:10px;margin:14px 0}
.answer{font:inherit;font-weight:700;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.answer:hover:not([disabled]){border-color:var(--ink)}
.answer.right{border-color:var(--good);background:#E3F5EC}
.answer.wrong{border-color:var(--bad);background:#FCE8EC;text-decoration:line-through}
.answer[disabled]{cursor:default}
.answers.three{grid-template-columns:repeat(3,1fr)}
.feedback{border-radius:12px}
.feedback:empty{display:none}
.feedback.good,.feedback.warn,.feedback.info{padding:14px 16px;margin:12px 0}
.feedback.good{background:#E3F5EC;color:#0B5A3E}
.feedback.warn{background:#FFF1DE;color:#7A4612}
.feedback.info{background:#E8EBFA;color:#24306E}
.roll{margin:12px 0;background:#F6F7FB;border-radius:12px;padding:10px 12px}
.roll figcaption{font-weight:700;font-size:.88rem;margin-bottom:4px}
.roll svg{width:100%;height:auto;display:block}
.rl{stroke:#E1E4F0;stroke-width:1}
.rn{fill:var(--blue)}
.rd{fill:var(--orange)}
.rt{font-size:11px;fill:var(--muted);font-family:var(--body)}
.help{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.help summary{font-weight:700;cursor:pointer}
.help p{margin:.6em 0 0}
.terms{background:#E4E7F3;border-radius:18px;padding:20px;position:sticky;top:84px}
.terms h2{font-size:1.15rem}
.terms ul{padding-left:18px;margin:0 0 10px}
.terms li{margin-bottom:8px;font-size:.93rem}
.proj-toggle{margin-bottom:12px;font-size:.92rem}
.proj-toggle input{accent-color:var(--ink)}
.summary h2{font-size:1.7rem}
.award{position:relative;width:200px;height:170px;margin:10px 0 6px}
.award-sleeve{position:absolute;left:0;top:10px;width:150px;height:150px;border-radius:5px;z-index:2;box-shadow:0 10px 24px rgba(26,29,58,.25)}
.award .vinyl.award-disc{position:absolute;left:10px;top:15px;width:140px;height:140px;z-index:1;animation:slideout 1.1s .25s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes slideout{to{left:58px;transform:rotate(200deg)}}
.award-text{font-size:1.1rem}

/* Voix, critique */
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.draw{background:#FFE9F0;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.draw strong{font-family:var(--display);font-size:1.2rem;line-height:1.2}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{font:inherit;font-size:.92rem;font-weight:700;padding:7px 13px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.alt{background:#FFF6DA;border-color:#F0D58A}
.vgroup .chips{margin-top:4px}
label{font-weight:700;display:block;margin:12px 0 6px}
label.inline,.switch{font-weight:400}
textarea,input[type=search],input:not([type]),select{font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;background:#fff;color:var(--ink)}
textarea{min-height:120px;resize:vertical;margin-bottom:12px}
select{width:auto}

/* Séquenceur */
.seq-tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.seq-tools label{margin:0;display:flex;align-items:center;gap:8px}
.sequencer{overflow-x:auto;padding:4px 0 10px;margin-bottom:6px}
.seq-row{display:grid;grid-template-columns:110px repeat(16,minmax(30px,1fr));gap:4px;margin:4px 0;align-items:center;min-width:640px}
.seq-head span{font-size:.8rem;font-weight:700;color:var(--muted);text-align:left;padding-left:3px}
.seq-label{font-weight:700;font-size:.9rem}
.cell{height:38px;border-radius:7px;border:0;background:#E3E6F1;cursor:pointer;padding:0}
.cell.bar{box-shadow:inset 3px 0 0 #B9BDD3}
.cell.on{background:var(--mint)}
.sequencer.mel .cell.on{background:var(--violet)}
.cell.now{outline:3px solid var(--yellow);outline-offset:-3px}
.cell.on.now{filter:brightness(1.25)}

/* Discothèque */
.shelf{display:flex;gap:8px;overflow-x:auto;padding:22px 4px 8px;margin-bottom:22px;align-items:flex-end}
.lp{flex:0 0 72px;height:270px;border-radius:5px;background:var(--c);color:#fff;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:14px 4px 10px;box-shadow:0 6px 14px rgba(26,29,58,.15);transition:margin .25s ease}
.lp-name{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--display);font-weight:800;font-size:1rem;white-space:nowrap;line-height:1.1}
.lp-date{font-size:.72rem;font-weight:700;text-align:center;line-height:1.2;opacity:.95}
.lp.cur{margin-bottom:18px;box-shadow:0 0 0 3px var(--ink),0 10px 18px rgba(26,29,58,.25)}
.lp:hover{margin-bottom:10px}
.fiche{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;background:var(--card);border-radius:22px;padding:28px;border-top:8px solid var(--c)}
.dates{font-weight:700;color:var(--muted)}
.works{padding-left:18px}
.fiche ul li{margin-bottom:6px}
.sleeve-big{position:relative;aspect-ratio:1;border-radius:6px;max-width:260px;display:flex;align-items:flex-end;padding:16px;color:#fff;font-family:var(--display);font-weight:800;font-size:1.5rem;isolation:isolate;margin-bottom:12px}
.sleeve-big .vinyl{position:absolute;width:86%;height:86%;top:7%;right:-16%;z-index:-1}
.sleeve-big span{position:relative}

/* Lexique */
.lex-tools{margin-bottom:18px}
.lexlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.lex{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;scroll-margin-top:100px}
.lex h2{font-size:1.15rem;margin:0}
.lex p{margin:.4em 0 0}
.lex.focus{box-shadow:0 0 0 3px var(--yellow)}
.lex .btn.pad{flex:none;width:46px;height:46px;justify-content:center;padding:0}

/* Carnet */
.level-card{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center;background:var(--card);border-radius:20px;padding:24px;border:1px solid var(--line)}
.collection{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.record{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--ink);padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.record:not(.got){opacity:.75}
.record span{display:flex;flex-direction:column}
.comp{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr 3.5em;gap:14px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.trace{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.trace p{margin:.3em 0 0;white-space:pre-wrap}
.switch{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--ink);flex:none;margin-top:2px}
.switch span{display:flex;flex-direction:column}
.form-row{display:flex;gap:14px;flex-wrap:wrap}
.form-row label{flex:1;min-width:180px}
.prose{max-width:760px}
.links li{margin-bottom:6px;overflow-wrap:anywhere}

/* Modale et message */
.toast{visibility:hidden;position:fixed;left:50%;bottom:22px;transform:translate(-50%,140%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:60;max-width:90vw;transition:transform .3s ease;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.show{visibility:visible;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(20,22,45,.55);display:none;place-items:center;z-index:70;padding:20px}
.modal.show{display:grid}
.modal-box{background:var(--card);border-radius:18px;padding:24px;max-width:440px;width:100%}

/* Mode classe */
body.proj main{max-width:1400px}
body.proj .q-card{font-size:1.25rem}
body.proj .q-prompt{font-size:2rem}
body.proj .terms,body.proj .help{display:none}
body.proj .m-grid{grid-template-columns:1fr}

/* Réduction des animations */
body.calm *,body.calm *:before,body.calm *:after{animation:none!important;transition:none!important}
body.calm .award .vinyl.award-disc{left:58px}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.award .vinyl.award-disc{left:58px}}

@media (max-width:900px){
  .hero{grid-template-columns:1fr;padding:28px}
  .deck{max-width:420px;width:100%;margin:auto}
  .m-grid,.fiche{grid-template-columns:minmax(0,1fr)}
  .terms{position:static}
  .bins{grid-template-columns:repeat(2,1fr);gap:24px 40px}
}
@media (max-width:640px){
  html{font-size:100%}
  .top-in{gap:10px;padding:10px 14px}
  nav{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap;margin:0}
  nav a{white-space:nowrap}
  #stop{margin-left:auto}
  main{padding:22px 14px 60px}
  .bins{padding-right:24px;gap:22px 30px}
  .sleeve-text{left:12px;right:10px;bottom:10px}
  .sleeve-text small{font-size:.74rem;line-height:1.25;display:block}
  .seq-row{grid-template-columns:84px repeat(16,minmax(28px,1fr));min-width:580px}
  .strip{grid-template-columns:1fr;gap:8px}
  .cards2,.level-card,.answers.three{grid-template-columns:1fr}
  .comp{grid-template-columns:1fr 3.5em}
  .comp .bar{grid-column:1/-1;grid-row:2}
  .m-head{padding:18px}

  .q-card{padding:18px}
}
@media print{
  .top,footer,.noprint,.btn,nav,#stop,.toast,.modal{display:none!important}
  body{background:#fff}
  main{padding:0}
  .block{break-inside:avoid}
}

 toute allure ?","sub":"Tempo, accelerando, ritardando","record":"Explorateur des tempos","goal":"Comparer et nommer la vitesse d’une pulsation.","hint":"Concentre-toi sur l’espace entre deux battements : plus il est court, plus le tempo est rapide.","example":"Une marche lente compte moins de pas par minute qu’une course.","terms":["tempo","lento-allegro","accelerando","ritardando"]},{"id":"metre","studio":"rythme","kind":"quiz","comp":"ecouter","title":"Un, deux, trois… valse ?","sub":"Mesures binaires et ternaires","record":"Chef de la mesure","goal":"Reconnaître si la pulsation se regroupe par deux (ou quatre) ou par trois.","hint":"Repère le temps fort, souvent plus grave ou plus appuyé, puis compte jusqu’au suivant.","example":"Une marche se compte « un-deux, un-deux ». Une valse se compte « un-deux-trois ».","terms":["mesure","binaire","ternaire","temps-fort"]},{"id":"ostinato","studio":"rythme","kind":"quiz","comp":"ecouter","title":"La boucle qui insiste","sub":"Repérer un ostinato","record":"Gardien de l’ostinato","goal":"Repérer un motif répété obstinément sous une mélodie.","hint":"Écoute surtout les sons graves : dans une piste, ils tournent en boucle.","example":"La basse du Canon de Pachelbel répète les mêmes huit notes pendant tout le morceau.","terms":["ostinato","motif"]},{"id":"hauteur","studio":"ecoute","kind":"quiz","comp":"ecouter","title":"Monter, descendre","sub":"Hauteur et contour mélodique","record":"Alpiniste des aigus","goal":"Situer un son plus aigu ou plus grave et suivre le dessin d’une mélodie.","hint":"Imagine une échelle : les sons aigus sont en haut, les sons graves en bas.","example":"Une sirène qui monte va vers l’aigu ; un « boum » de grosse caisse est grave.","terms":["hauteur","aigu","grave","melodie"]},{"id":"intensite","studio":"ecoute","kind":"quiz","comp":"ecouter","title":"Plus fort, plus doux","sub":"Nuances et intensité","record":"Maître des nuances","goal":"Reconnaître une nuance forte ou douce et son évolution.","hin function studio(id) { for (var i = 0; i < DATA.studios.length; i++) { if (DATA.studios[i].id === id) { return DATA.studios[i]; } } return null; }
function missionsOf(sid) { var o = []; for (var i = 0; i < DATA.missions.length; i++) { if (DATA.missions[i].studio === sid) { o.push(DATA.missions[i]); } } return o; }
function term(id) { for (var i = 0; i < DATA.lexique.length; i++) { if (DATA.lexique[i].id === id) { return DATA.lexique[i]; } } return null; }
function entry(id) { for (var i = 0; i < DATA.frise.length; i++) { if (DATA.frise[i].id === id) { return DATA.frise[i]; } } return null; }
function compLabel(k) { var c = DATA.comps[k]; return c ? (cycle() === 3 ? c.c3 : c.c4) : ''; }
function doneCount() { var n = 0; for (var i = 0; i < DATA.missions.length; i++) { if (S.missions[DATA.missions[i].id] && S.missions[DATA.missions[i].id].done) { n++; } } return n; }
function isDue(id) { var m = S.missions[id], mi = mission(id); if (!m || !m.done || !mi || mi.kind !== 'quiz') { return false; } return daysSince(m.last) >= INTERVALS[Math.min(m.reviews, 4)]; }
function dueList() { var o = []; for (var i = 0; i < DATA.missions.length; i++) { if (isDue(DATA.missions[i].id)) { o.push(DATA.missions[i]); } } return o; }
function levelInfo() {
  var L = DATA.levels, cur = L[0], next = null;
  for (var i = 0; i < L.length; i++) { if (S.xp >= L[i][0]) { cur = L[i]; next = L[i + 1] || null; } }
  var pct = next ? Math.round((S.xp - cur[0]) / (next[0] - cur[0]) * 100) : 100;
  return { name: cur[1], next: next, pct: pct };
}
function addXP(n) {
  var before = levelInfo().name;
  S.xp += n; save();
  var after = levelInfo().name;
  if (after !== before) { toast('Nouveau titre : ' + after + ' !'); }
}

/* ---------- VU-mètre ---------- */
var vuRAF = null;
function vuStart() {
  if (vuRAF) { return; }
  var draw = function () {
    var cv = $('#vu');
    if (!cv) { vuRAF = null; return; }
    var ctx2 = cv.getContext('2d'), w = cv.width, h = cv.height, bars = 28;
    ctx2.clearRect(0, 0, w, h);
    var data = null;
    if (A.analyser) { data = new Uint8Array(A.analyser.frequencyBinCount); A.analyser.getByteFrequencyData(data); }
    var col = getComputedStyle(cv).color || '#3D5AFE';
    var segs = 10, sh = h / segs, bw = w / bars;
    for (var i = 0; i < bars; i++) {
      var val = data ? data[Math.floor(i * data.length / bars * 0.7)] / 255 : 0, lit = Math.round(val * segs * 1.15);
      for (var s = 0; s < segs; s++) {
        ctx2.fillStyle = s < 6 ? '#2EE6B8' : (s < 8 ? '#FFC12E' : '#FF4F86');
        ctx2.globalAlpha = s < lit ? 1 : 0.1;
        ctx2.fillRect(i * bw + 2, h - (s + 1) * sh + 1.5, bw - 4, sh - 3);
      }
    }
    ctx2.globalAlpha = 1;
    vuRAF = window.requestAnimationFrame ? requestAnimationFrame(draw) : setTimeout(draw, 40);
  };
  draw();
}
function consoleBlock(inner) {
  return '<div class="console"><div class="console-top"><span class="led" aria-hidden="true"></span><span>Lecture</span><span class="screws" aria-hidden="true"></span></div><canvas id="vu" width="560" height="64" aria-hidden="true"></canvas><div class="console-row">' + inner + '</div>' +

/* ---------- Partition graphique ---------- */
var DRUM_NAMES = { kick: 'Grosse caisse', snare: 'Caisse claire', hat: 'Charleston', clap: 'Claps', bloc: 'Bloc' };
function rollSVG(fn, label) {
  var r = dryRun(fn), ev = r.ev;
  if (!ev.length) { return ''; }
  var T = Math.max(r.end, 0.5), notes = [], drums = {}, dk = [];
  for (var i = 0; i < ev.length; i++) { if (ev[i].k === 'n') { notes.push(ev[i]); } else { if (!drums[ev[i].k]) { drums[ev[i].k] = []; dk.push(ev[i].k); } drums[ev[i].k].push(ev[i]); } }
  var W = 640, NH = notes.length ? 120 : 0, LH = 18, H = NH + dk.length * LH + 8, out = [];
  if (notes.length) {
    var lo = 200, hi = 0;
    for (var j = 0; j < notes.length; j++) { lo = Math.min(lo, notes[j].m); hi = Math.max(hi, notes[j].m); }
    lo -= 2; hi += 2;
    for (var g = 0; g < 4; g++) { out.push('<line x1="0" x2="' + W + '" y1="' + (g * NH / 4 + 4) + '" y2="' + (g * NH / 4 + 4) + '" class="rl"/>'); }
    for (var k = 0; k < notes.length; k++) {
      var n = notes[k], x = n.t / T * W, w = Math.max(4, n.d / T * W - 1), y = 4 + (hi - n.m) / (hi - lo) * (NH - 12);
      out.push('<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + w.toFixed(1) + '" height="7" rx="3.5" class="rn" style="opacity:' + (0.3 + 0.7 * Math.min(1, n.v)).toFixed(2) + '"/>');
    }
  }
  for (var q = 0; q < dk.length; q++) {
    var yy = NH + 8 + q * LH + LH / 2;
    out.push('<text x="2" y="' + (yy + 4) + '" class="rt">' + DRUM_NAMES[dk[q]] + '</text>');
    for (var z = 0; z < drums[dk[q]].length; z++) { var e = drums[dk[q]][z]; out.push('<circle cx="' + (90 + e.t / T * (W - 92)).toFixed(1) + '" cy="' + yy + '" r="' + (2.5 + 3 * Math.min(1, e.v)).toFixed(1) + '" class="rd"/>'); }
  }
  return '<figure class="roll"><figcaption>' + esc(label) + '</figcaption><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(label) + ' : représentation graphique, le temps de gauche à droite, l’aigu en haut.">' + out.join('') + '</svg></figure>';
}

/* ---------- Mission quiz ---------- */
var Q = null;
function startSeries(m, proj) {
  var d = lvl(), items = [];
  for (var i = 0; i < 5; i++) { items.push(GEN[m.id](d)); }
  Q = { mid: m.id, items: items, i: 0, score: 0, tries: 0, answered: false, proj: !!proj, marks: [], level: S.level };
}
function pageQuiz(m) {
  if (!Q || Q.mid !== m.id || Q.level !== S.level) { startSeries(m, Q && Q.mid === m.id ? Q.proj : false); }
  return missionHead(m) + '<div class="m-grid"><div class="m-main"><div class="proj-toggle"><label><input type="checkbox" id="proj"' + (Q.proj ? ' checked' : '') + '> Mode classe (vidéoprojecteur) : sans points, réponse révélée par l’enseignant</label></div><div id="qzone"></div>' + helpBlock(m) + '</div>' + termsBlock(m) + '</div>';
}
function dots() {
  var h = '<ol class="dots" aria-label="Progression de la série">';
  for (var i = 0; i < 5; i++) { var c = Q.marks[i] === true ? 'ok' : (Q.marks[i] === false ? 'ko' : (i === Q.i ? 'cur' : '')); h += '<li class="' + c + '"><span class="sr">Question ' + (i + 1) + (c === 'ok' ? ' réussie' : (c === 'ko' ? ' à revoir' : '')) + '</span></li>'; }
  return h + '</ol>';
}
function renderQuestion(m) {
  var z = $('#qzone'); if (!z) { return; }
  if (Q.i >= 5) { renderSummary(m); return; }
  var it = Q.items[Q.i], pads = '';
  for (var i = 0; i < it.tracks.length; i++) { pads += '<button class="btn pad" data-track="' + i + '">' + esc(it.tracks[i].label) + '</button>'; }
  var opts = '';
  for (var j = 0; j < it.opts.length; j++) { opts += '<button class="answer" data-answer="' + j + '">' + esc(it.opts[j]) + '</button>'; }
  z.innerHTML = '<div class="q-card">' + dots() + '<p class="q-num">Question ' + (Q.i + 1) + ' sur 5</p><h2 class="q-prompt" tabindex="-1">' + esc(it.prompt) + '</h2>' + consoleBlock(pads) +
    '<div class="answers" role="group" aria-label="Réponses">' + opts + '</div><p class="kbd-hint">Au clavier : P pour écouter, A B C D pour répondre, N pour continuer.</p>' + (Q.proj ? '<button class="btn ghost" id="reveal">Révéler la réponse</button>' : '') +
    '<div id="feedback" class="feedback" aria-live="polite"></div><div id="rolls"></div><div id="nextzone"></div></div>';
  bindConsole();
  $$('[data-track]').forEach(function (b) { b.onclick = function () { var tr = it.tracks[Number(b.getAttribute('data-track'))]; audioGo(tr.fn); }; });
  $$('[data-answer]').forEach(function (b) { b.onclick = function () { answer(m, Number(b.getAttribute('data-answer')), b); }; });
  var rv = $('#reveal'); if (rv) { rv.onclick = function () { finishQuestion(m, false, true); }; }
}
function answer(m, i, btn) {
  if (Q.answered) { return; }
  var it = Q.items[Q.i], fb = $('#feedback');
  if (i === it.ans) {
    btn.className += ' right';
    if (Q.tries === 0) { Q.score++; Q.marks[Q.i] = true; if (!Q.proj) { addXP(5); } } else { Q.marks[Q.i] = false; }
    finishQuestion(m, true, false);
  } else {
    Q.tries++; btn.className += ' wrong'; btn.disabled = true;
    var left = $$('.answer:not([disabled])').length;
    if (left <= 1 || Q.tries >= 2) { Q.marks[Q.i] = false; finishQuestion(m, false, false); }
    else { fb.className = 'feedback warn'; fb.textContent = 'Pas encore. ' + mission(m.id).hint + ' Réécoute et choisis une autre réponse.'; }
  }
}
function finishQuestion(m, ok, revealed) {
  var it = Q.items[Q.i], fb = $('#feedback');
  Q.answered = true;
  if (Q.marks[Q.i] == null) { Q.marks[Q.i] = false; }
  var dl = $('.dots'); if (dl) { var tmp = document.createElement('div'); tmp.innerHTML = dots(); dl.parentNode.replaceChild(tmp.firstChild, dl); }
  $$('.answer').forEach(function (b, idx) { b.disabled = true; if (idx === it.ans && b.className.indexOf('right') < 0) { b.className += ' right'; } });
  var rv = $('#reveal'); if (rv) { rv.parentNode.removeChild(rv); }
  fb.className = 'feedback ' + (ok ? 'good' : 'info');
  fb.innerHTML = (ok ? (Q.tries === 0 ? '<strong>Bien entendu !</strong> ' : '<strong>Trouvé au deuxième essai.</strong> ') : (revealed ? '<strong>Réponse :</strong> ' + esc(it.opts[it.ans]) + '. ' : '<strong>La bonne réponse était :</strong> ' + esc(it.opts[it.ans]) + '. ')) + esc(it.explain) +
    (it.entry ? ' <a href="#discotheque/' + it.entry.id + '">Voir la fiche ' + esc(it.entry.name) + '</a>' : '');
  if (S.settings.viz) {
    var r = '';
    for (var i = 0; i < it.tracks.length; i++) { r += rollSVG(it.tracks[i].fn, it.tracks[i].label.replace('▶ ', '')); }
    $('#rolls').innerHTML = r ? '<p class="muted small">Ce que tu as entendu, dessiné : chaque trait est un son, plus il est haut, plus il est aigu ; plus il est opaque, plus il est fort.</p>' + r : '';

    var need = isMel ? 6 : 4;
    if (count < need || val.length < 15) { f.className = 'feedback warn'; f.textContent = 'Allume au moins ' + need + ' cases et explique ton choix en une phrase (' + count + ' case' + (count > 1 ? 's' : '') + ' pour l’instant).'; return; }
    var st = ms(m.id), first = !st.done;
    st.done = true; st.series++; st.last = today(); st.text = val.slice(0, 1000);
    save(); if (first) { addXP(30); }
    f.className = 'feedback good'; f.innerHTML = '<strong>Création enregistrée dans ton carnet.</strong> ' + (first ? 'Nouveau disque : ' + esc(m.record) + ' (+30 points). ' : '') + 'Tu peux aussi la télécharger en WAV pour la faire écouter.';
  };
}

/* ---------- Discothèque ---------- */
function pageDisco(id) {
  var cur = entry(id) || DATA.frise[0], h = '<div class="page-head"><h1>La Discothèque</h1><p class="muted">Dix bacs, de la musique médiévale aux musiques électroniques. Chaque fiche propose un extrait joué par l’application et une piste pour écouter une vraie interprétation.</p></div><div class="shelf" role="list">';
  for (var i = 0; i < DATA.frise.length; i++) {
    var e = DATA.frise[i];
    h += '<a role="listitem" class="lp' + (e.id === cur.id ? ' cur' : '') + '" href="#discotheque/' + e.id + '" style="--c:' + e.color + '"' + (e.id === cur.id ? ' aria-current="true"' : '') + '><span class="lp-name">' + esc(e.name) + '</span><span class="lp-date">' + esc(e.y) + '</span></a>';
  }
  h += '</div><article class="fiche" style="--c:' + cur.color + '"><div class="fiche-main"><h2>' + esc(cur.name) + '</h2><p class="dates">' + esc(cur.dates) + '</p><p>' + esc(cur.context) + '</p><h3>À l’oreille, on repère</h3><ul>';
  for (var t = 0; t < cur.traits.length; t++) { h += '<li>' + esc(cur.traits[t]) + '</li>'; }
  h += '</ul><h3>Instruments</h3><p>' + esc(cur.instruments) + '</p><h3>Œuvres et artistes repères</h3><ul class="works">';
  for (var o = 0; o < cur.oeuvres.length; o++) { h += '<li><strong>' + esc(cur.oeuvres[o][0]) + '</strong>, ' + esc(cur.oeuvres[o][1]) + '</li>'; }
  h += '</ul></div><div class="fiche-side"><div class="sleeve-big" style="background:' + cur.color + '">' + vinyl(cur.color, 'peek big', '') + '<span>' + esc(cur.name) + '</span></div><h3>' + esc(cur.excerpt.title) + '</h3><p class="muted small">' + esc(cur.excerpt.note) + '</p>' +
    consoleBlock('<button class="btn pad" id="dplay">▶ Écouter l’extrait</button>') +
    '<p class="small">Version synthétique jouée par l’application. <a href="https://www.youtube.com/results?search_query=' + encodeURIComponent(cur.search) + '" target="_blank" rel="noopener">Chercher une vraie interprétation sur YouTube</a> (avec ton professeur).</p></div></article>';
  return h;
}
function bindDisco(id) {
  bindConsole();
  var cur = entry(id) || DATA.frise[0];
  $('#dplay').onclick = function () { audioGo(function (t) { return playExcerpt(cur.excerpt, t); }); };
  var c = $('.lp.cur'); if (c && c.scrollIntoView && id) { try { c.scrollIntoView({ block: 'nearest', inline: 'center' }); } catch (e) {} }
}

/* ---------- Lexique ---------- */
var LEXF = { q: '', cat: '' };
function pageLex(id) {
  var cats = [];
  for (var i = 0; i < DATA.lexique.length; i++) { if (cats.indexOf(DATA.lexique[i].cat) < 0) { cats.push(DATA.lexique[i].cat); } }
  var h = '<div class="page-head"><h1>Lexique</h1><p class="muted">Les mots pour décrire ce que tu entends. Touche ▶ pour entendre un exemple.</p></div><div class="lex-tools"><label class="search"><span class="sr">Rechercher un mot</span><input type="search" id="lq" placeholder="Rechercher un mot (tempo, canon…)" value="' + esc(LEXF.q) + '"></label><div class="chips">' +
    '<button class="chip' + (LEXF.cat === '' ? ' on' : '') + '" data-cat="">Tout</button>';
  for (var c = 0; c < cats.length; c++) { h += '<button class="chip' + (LEXF.cat === cats[c] ? ' on' : '') + '" data-cat="' + esc(cats[c]) + '">' + esc(cats[c]) + '</button>'; }
  h += '</div></div><div id="lexlist" class="lexlist"></div>';
  return h;
}
function renderLexList(focusId) {
  var q = normalize(LEXF.q.trim()), out = '';
  for (var i = 0; i < DATA.lexique.length; i++) {
    var t = DATA.lexique[i];
    if (LEXF.cat && t.cat !== LEXF.cat) { continue; }
    if (q && normalize(t.t + ' ' + t.d).indexOf(q) < 0) { continue; }
    out += '<div class="lex k-' + catSlug(t.cat) + (focusId === t.id ? ' focus' : '') + '" id="lx-' + t.id + '"><div><h2>' + esc(t.t) + '</h2><span class="muted small">' + esc(t.cat) + '</span><p>' + esc(t.d) + '</p></div>' + (t.demo ? '<button class="btn pad sm" data-demo="' + t.demo + '" aria-label="Écouter un exemple : ' + esc(t.t) + '">▶</button>' : '') + '</div>';
  }
  $('#lexlist').innerHTML = out || '<p>Aucun mot ne correspond. Essaie un autre mot ou choisis « Tout ».</p>';
  $$('[data-demo]').forEach(function (b) { b.onclick = function () { var f = demoFn(b.getAttribute('data-demo')); if (f) { audioGo(f); } }; });
}
function bindLex(id) {
  if (id) { LEXF.q = ''; LEXF.cat = ''; $('#lq').value = ''; }
  renderLexList(id);
  $('#lq').oninput = function () { LEXF.q = this.value; renderLexList(); };
  $$('[data-cat]').forEach(function (b) { b.onclick = function () { LEXF.cat = b.getAttribute('data-cat'); $$('[data-cat]').forEach(function (x) { x.className = 'chip' + (x === b ? ' on' : ''); }); renderLexList(); }; });
  if (id) { var el = $('#lx-' + id); if (el) { setTimeout(function () { el.scrollIntoView({ block: 'center' }); }, 30); } }
}

/* ---------- Carnet ---------- */
function pageCarnet() {
  var li = levelInfo(), h = '<div class="page-head"><h1>Mon carnet' + (S.name ? ' de ' + esc(S.name) : '') + '</h1><p class="muted">Les disques montrent les missions réalisées. Ils ne prouvent pas à eux seuls la maîtrise d’une compétence : c’est une trace à discuter.</p></div>';
  h += '<section class="block level-card"><div><span class="muted small">Ton titre</span><h2>' + esc(li.name) + '</h2><p>' + S.xp + ' points d’exploration' + (li.next ? ', encore ' + (li.next[0] - S.xp) + ' pour devenir « ' + esc(li.next[1]) + ' »' : '') + '.</p></div><div class="bar big"><span style="width:' + li.pct + '%"></span></div></section>';
  h += '<section class="block"><h2>Ma collection</h2><div class="collection">';
  for (var i = 0; i < DATA.missions.length; i++) {
    var m = DATA.missions[i], st = S.missions[m.id] || {};
    h += '<a class="record' + (st.done ? ' got' : '') + '" href="#mission/' + m.id + '">' + vinyl(st.done ? studioColor(m.studio) : '#e2e4ee', 'small' + (st.gold ? ' gold' : ''), '<span style="color:' + (st.done ? iconColor(m.studio) : '#8A8FB0') + '">' + icon(m.id) + '</span>') + '<span><strong>' + esc(m.record) + '</strong><span class="muted small">' + esc(m.title) + (st.gold ? ', disque d’or' : (st.done ? '' : ', à gagner')) + '</span></span></a>';
  }
  h += '</div></section><section class="block"><h2>Mes compétences travaillées</h2><p class="muted small">Missions réalisées pour chaque grande compétence du programme (cycle ' + cycle() + ').</p>';
  for (var k in DATA.comps) {
    if (!DATA.comps.hasOwnProperty(k)) { continue; }
    var tot = 0, got = 0;
    for (var j = 0; j < DATA.missions.length; j++) { if (DATA.missions[j].comp === k) { tot++; if (S.missions[DATA.missions[j].id] && S.missions[DATA.missions[j].id].done) { got++; } } }
    h += '<div class="comp"><span>' + esc(compLabel(k)) + '</span><span class="bar"><span style="width:' + Math.round(got / tot * 100) + '%"></span></span><span class="small">' + got + ' / ' + tot + '</span></div>';
  }
  h += '</section><section class="block"><h2>Mes traces écrites</h2>';
  var traces = 0;
  for (var t = 0; t < DATA.missions.length; t++) { var s2 = S.missions[DATA.missions[t].id]; if (s2 && s2.text) { traces++; h += '<div class="trace"><strong>' + esc(DATA.missions[t].title) + '</strong><p>' + esc(s2.text) + '</p></div>'; } }
  if (!traces) { h += '<p>Tes créations, critiques et réflexions apparaîtront ici. <a href="#studios/creation">Commence par fabriquer une boucle</a>.</p>'; }
  var due = dueList();
  h += '</section><section class="block"><h2>Réactivation</h2><p class="muted small">Une mission réussie revient après 2 jours, puis 4, 7, 14 et 30 jours : réécouter au bon moment aide à retenir durablement.</p>';
  if (due.length) { h += '<div class="tiles">'; for (var d = 0; d < due.length; d++) { h += missionTile(due[d]); } h += '</div>'; } else { h += '<p>Rien à réécouter aujourd’hui.</p>'; }
  h += '</section><section class="block noprint"><h2>Mon carnet ailleurs</h2><p class="muted small">La progression reste dans ce navigateur. Pour changer d’appareil ou la montrer, exporte-la.</p><div class="row-btns"><button class="btn ghost" id="cprint">Imprimer mon carnet</button><button class="btn ghost" id="cexp">Exporter (fichier)</button><label class="btn ghost file">Importer un fichier<input type="file" id="cimp" accept=".json,application/json"></label><a class="btn ghost" href="#reglages">Réglages</a></div></section>';
  return h;
}
function exportData() {
  var blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'musicollege-carnet-' + (S.name ? S.name.replace(/[^a-zA-Z0-9\-]+/g, '-') + '-' : '') + today() + '.json';
  document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.parentNode.removeChild(a); }, 1500);
}
function importData(input) {
  var f = input.files && input.files[0]; if (!f) { return; }
  var rd = new FileReader();
  rd.onload = function () {
    try {
      var d = JSON.parse(rd.result);
      if (!d || d.v !== 2 || typeof d.missions !== 'object') { throw new Error('format'); }
      askConfirm('Remplacer la progression de cet appareil par celle du fichier ?', 'Remplacer', function () { S = d; save(); applySettings(); render(); toast('Carnet importé.'); });
    } catch (e) { toast('Ce fichier n’est pas un carnet Musicollège valide.'); }
  };
  rd.readAsText(f);
}
function bindCarnet() {
  $('#cprint').onclick = function () { window.print(); };
  $('#cexp').onclick = exportData;
  $('#cimp').onchange = function () { importData(this); };
}

/* ---------- Réglages ---------- */
function toggle(id, label, on, hint) { return '<label class="switch"><input type="checkbox" data-set="' + id + '"' + (on ? ' checked' : '') + '><span><strong>' + label + '</strong><span class="muted small">' + hint + '</span></span></label>'; }
function pageSettings() {
  return '<div class="page-head"><h1>Réglages</h1></div><section class="block"><h2>Ton profil</h2><p class="muted small">Choisis un pseudo, sans ton vrai nom. Tout reste dans ce navigateur.</p><div class="form-row"><label>Pseudo<input id="pname" maxlength="25" value="' + esc(S.name) + '" placeholder="Ex. Écho"></label><label>Classe<select id="plevel">' + ['6e', '5e', '4e', '3e'].map(function (x) { return '<option' + (x === S.level ? ' selected' : '') + '>' + x + '</option>'; }).join('') + '</select></label></div><p class="muted small">La classe règle la difficulté des questions : écarts plus fins, plus de choix, extraits plus subtils.</p><button class="btn" id="psave">Enregistrer</button></section>' +
    '<section class="block"><h2>Affichage et confort</h2>' + toggle('dys', 'Police Lexend', S.settings.dys, 'Lettres plus espacées, souvent plus confortables pour les lecteurs dys.') + toggle('big', 'Texte plus grand', S.settings.big, 'Agrandit tout le texte.') + toggle('contrast', 'Contraste renforcé', S.settings.contrast, 'Couleurs plus marquées, fonds plus nets.') + toggle('calm', 'Moins d’animations', S.settings.calm, 'Le disque ne tourne plus, pas d’effets.') + toggle('viz', 'Dessin des sons après chaque réponse', S.settings.viz, 'Montre une partition graphique de ce que tu viens d’entendre.') + '</section>' +
    '<section class="block"><h2>Mes données</h2><p class="muted small">Aucun compte, aucun envoi : tout est enregistré dans ce navigateur, sur cet appareil.</p><div class="row-btns"><button class="btn ghost" id="sexp">Exporter mon carnet</button><label class="btn ghost file">Importer un carnet<input type="file" id="simp" accept=".json,application/json"></label><button class="btn danger" id="serase">Effacer mes données</button></div></section>';
}
function bindSettings() {
  $('#psave').onclick = function () { S.name = $('#pname').value.trim().slice(0, 25); S.level = $('#plevel').value; save(); Q = null; toast('Profil enregistré.'); };
  $$('[data-set]').forEach(function (c) { c.onchange = function () { S.settings[c.getAttribute('data-set')] = c.checked; save(); applySettings(); }; });
  $('#sexp').onclick = exportData;
  $('#simp').onchange = function () { importData(this); };
  $('#serase').onclick = function () { askConfirm('Effacer le profil, les disques et les créations sur cet appareil ? C’est définitif.', 'Tout effacer', function () { try { localStorage.removeItem(KEY); localStorage.removeItem(OLDKEY); } catch (e) {} S = defState(); save(); applySettings(); location.hash = '#accueil'; render(); toast('Données effacées.'); }); };
}

/* ---------- Sources ---------- */
function pageSources() {
  return '<div class="page-head"><h1>Sources et crédits</h1></div><section class="block prose"><h2>Programmes officiels</h2><p>La 6e appartient au cycle 3 ; les 5e, 4e et 3e au cycle 4. Les pages Éduscol de la rentrée 2026-2027 renvoient au programme d’éducation musicale du BO n° 31 du 30 juillet 2020. Les missions travaillent ses quatre grandes compétences ; les niveaux de difficulté sont des choix pédagogiques, pas des prescriptions officielles.</p><ul class="links"><li><a href="https://www.education.gouv.fr/bo/20/Hebdo31/MENE2018714A.htm" target="_blank" rel="noopener">Arrêté et annexes du BO n° 31 du 30 juillet 2020</a></li><li><a href="https://eduscol.education.gouv.fr/4356/enseigner-au-cycle-3" target="_blank" rel="noopener">Éduscol, enseigner au cycle 3</a></li><li><a href="https://eduscol.education.gouv.fr/4362/enseigner-au-cycle-4" target="_blank" rel="noopener">Éduscol, enseigner au cycle 4</a></li><li><a href="https://eduscol.education.gouv.fr/4428/education-musicale" target="_blank" rel="noopener">Éduscol, éducation musicale et ressources d’accompagnement</a></li></ul></section>' +
    '<section class="block prose"><h2>Sons et musiques</h2><p>Tous les sons sont synthétisés en direct dans le navigateur (Web Audio API) : aucun enregistrement n’est intégré. Les mélodies de la Discothèque sont des arrangements simplifiés d’œuvres du domaine public (chant grégorien, Greensleeves, Menuet attribué à Petzold, Mozart, Grieg, Satie, Joplin, Frère Jacques). Les rythmes rock, rap et électro sont des créations originales qui imitent un style, pas des extraits d’œuvres. Les imitations d’instruments et de voix sont volontairement simples : rien ne remplace l’écoute de vrais musiciens.</p><p>Baisse le volume avant d’écouter, fais des pauses et évite une écoute prolongée trop forte.</p></section>' +
    '<section class="block prose"><h2>En classe</h2><p>Le mode classe (case à cocher dans chaque mission d’écoute) agrandit l’affichage, ne compte pas de points et permet à l’enseignant de révéler la réponse : pratique au vidéoprojecteur pour une écoute collective. Le Lexique sert de banque d’exemples sonores. Les critiques écrites et réflexions du carnet peuvent servir de point de départ à un échange oral.</p></section>' +
    '<section class="block prose"><h2>Polices</h2><p>Bricolage Grotesque, Atkinson Hyperlegible et Lexend, via Google Fonts (licence SIL Open Font).</p></section>' +
    '<section class="block prose"><h2>Limites</h2><p>Pas de compte, de publicité, de microphone ni de synchronisation. L’application n’entend pas l’élève : la pratique vocale est autoévaluée. La représentation graphique d’un son aide à comprendre mais n’équivaut pas à une écoute. Aucune conformité RGPD ni certification d’accessibilité n’est revendiquée ; des essais avec des élèves sont recommandés avant un déploiement large.</p></section>';
}

/* ===================== ROUTEUR ===================== */
function render() {
  stopAll();
  document.body.className = document.body.className.replace(/\s?proj/g, '');
  var hash = location.hash.slice(1) || 'accueil', parts = hash.split('/'), page = parts[0], arg = parts[1] || '';
  var navKey = page === 'mission' ? 'studios' : page;
  $$('nav a').forEach(function (a) { var on = a.getAttribute('href') === '#' + navKey; a.className = on ? 'on' : ''; if (on) { a.setAttribute('aria-current', 'page'); } else { a.removeAttribute('aria-current'); } });
  var m = page === 'mission' ? mission(arg) : null;
  if (m) { app.style.setProperty('--c', studioColor(m.studio)); } else { app.style.removeProperty('--c'); }
  if (m) {
    if (m.kind === 'quiz') { app.innerHTML = pageQuiz(m); bindQuiz(m); }
    else if (m.kind === 'echo') { app.innerHTML = pageEcho(m); renderEcho(m); }
    else if (m.kind === 'voice') { app.innerHTML = pageVoice(m); bindVoice(m); }
    else if (m.kind === 'critique') { app.innerHTML = pageCritique(m); bindCritique(m); }
    else { app.innerHTML = pageCreate(m); bindCreate(m); }
  }
  else if (page === 'studios') { app.innerHTML = pageStudios(arg); }
  else if (page === 'discotheque') { app.innerHTML = pageDisco(arg); bindDisco(arg); }
  else if (page === 'lexique') { app.innerHTML = pageLex(arg); bindLex(arg); }
  else if (page === 'carnet') { app.innerHTML = pageCarnet(); bindCarnet(); }
  else if (page === 'reglages') { app.innerHTML = pageSettings(); bindSettings(); }
  else if (page === 'sources') { app.innerHTML = pageSources(); }
  else { app.innerHTML = pageHome(); bindHome(); }
  if (page === 'studios' && arg) { var sec = $('#st-' + arg); if (sec) { setTimeout(function () { sec.scrollIntoView({ block: 'start' }); }, 20); return; } }
  if (!(page === 'lexique' && arg)) { window.scrollTo(0, 0); }
  var h1 = $('#app h1'); if (h1) { h1.setAttribute('tabindex', '-1'); }
}
document.getElementById('stop').onclick = stopAll;
document.addEventListener('keydown', function (e) {
  var tg = e.target && e.target.tagName;
  if (/INPUT|TEXTAREA|SELECT/.test(tg || '') || e.ctrlKey || e.metaKey || e.altKey) { return; }
  var k = (e.key || '').toLowerCase(), map = { a: 0, b: 1, c: 2, d: 3, '1': 0, '2': 1, '3': 2, '4': 3 };
  if (map.hasOwnProperty(k)) { var b = $$('#qzone .answer')[map[k]]; if (b && !b.disabled) { b.click(); e.preventDefault(); } }
  else if (k === 'p') { var t = $('#qzone [data-track]'); if (t) { t.click(); e.preventDefault(); } }
  else if (k === 'n') { var n = $('#next'); if (n) { n.click(); e.preventDefault(); } }
});
window.addEventListener('hashchange', render);
applySettings();
render();

})();
</script>
